[workflow]
name = 'single_sample_qc_popgen'
input_cohorts = ['COH0000']
sequencing_type = 'genome'
last_stages = ['RegisterQcMetricsToMetamist']

[cramqc]
assume_sorted = true
num_pcs = 4

[workflow.multiqc]
send_to_slack = true
# If true, will deactivate any sequencing groups that fail any of the qc_thresholds.
deactivate_sgs = false

[qc_thresholds.genome.min]
pct_genome_gt_20x = 0.90
mapping_rate_pct = 80
q30_bases_pct = 80

[qc_thresholds.genome.max]
contamination_dragen = 0.03
chimera_rate = 0.03

[qc_thresholds.genome.equality]
ploidy_estimation = true

[impute_sex]
# Renormalise somalier f_stat by the cohort median chrX heterozygosity
# over putative XX samples. Requires >= median_correct_min_xx putative XX
# samples; otherwise falls back to the simple proxy with a logged warning.
median_correct_f_stat = false

# Minimum number of putative XX samples required before median correction
# is applied. Statistical guard: a median over very few samples is noisy.
median_correct_min_xx = 10

# Somalier's chrY panel ships ~17 sites (chrX panel is ~365). On a 100+
# sample CPG cohort: true XY has y_calls >= 15, normal female 0-2,
# true X0/Turner ~0. Tune for different somalier panels or sequencing
# depths.
# y_calls > y_calls_loy_min on a DRAGEN X0 call -> loss-of-Y -> XY.
y_calls_loy_min = 5
# y_calls <= y_calls_turner_max confirms "no chrY signal" — used to gate
# "clean" XX samples for the cohort median-het correction.
y_calls_turner_max = 1

# f_stat ~ 1 looks XY (homozygous chrX); f_stat ~ 0 looks XX (heterozygous).
# A 103-sample CPG cohort showed clean bimodal separation around 0.5 in
# both unnormalised and median-corrected modes, so a single midpoint is
# the production default. Asymmetric cutoffs (e.g. f_stat_xx_max=0.7 and
# f_stat_xy_min=0.3) are valid for cohorts whose distribution warrants a
# buffer zone around 0.5.
#   DRAGEN XX + f_stat > f_stat_xx_max -> ambiguous
#   DRAGEN XY + f_stat < f_stat_xy_min -> ambiguous
f_stat_xx_max = 0.5
f_stat_xy_min = 0.5

[workflow.swap_check]
# Thresholds for swap classification — calibrated against COH8495 (expected
# self-matches sat at relatedness ~0.999 with n ~5800). Generous margins
# given the >0.6 gap between true match and next-best.
relatedness_concordant_min = 0.8
relatedness_swap_max = 0.3
n_sites_min = 500

# Parallel workers for `gcloud storage cp` of WGS sketches inside the
# somalier container (matches the manifest pattern used by run_multiqc).
somalier_localise_parallelism = 16

# REQUIRED in the user's analysis-runner config (no defaults here): pgen,
# pvar, psam paths of the rolling popgen-genotyping export. These analyses
# are NOT registered in metamist, so the path can't be looked up and must
# be set explicitly. The stage will error at queue time if any is missing.
# Example:
#     pgen_path = 'gs://.../<DATE>_cohort.pgen'
#     pvar_path = 'gs://.../<DATE>_cohort.pvar'
#     psam_path = 'gs://.../<DATE>_cohort.psam'
#
# Container images come from image_path('plink') / image_path('somalier')
# and references (somalier sites VCF, hg38 fasta) come from reference_path()
# — neither is configured here.

[ica.pipelines]
dragen_version = 'dragen_3_7_8'

[slack]
channel = 'C09P4QCKNR1' # Slack channel ID for #popgen-pipeline-alerts
token_secret_id = 'dragen-single-sample-qc'
token_project_id = 'cpg-common'
