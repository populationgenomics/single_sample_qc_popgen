[workflow]
name = 'single_sample_qc_popgen'
input_cohorts = ['COH0000']
sequencing_type = 'genome'
last_stages = ['RegisterQcMetricsToMetamist']

[cramqc]
assume_sorted = true
num_pcs = 4

[workflow.multiqc]
send_to_slack = true
# If true, will deactivate any sequencing groups that fail any of the qc_thresholds.
deactivate_sgs = false

[qc_thresholds.genome.min]
pct_genome_gt_20x = 0.90
mapping_rate_pct = 80
q30_bases_pct = 80

[qc_thresholds.genome.max]
contamination_dragen = 0.03
chimera_rate = 0.03

[qc_thresholds.genome.equality]
ploidy_estimation = true

[impute_sex]
# Somalier's chrY panel ships ~17 sites (chrX panel is ~365). On a 100+
# sample CPG cohort: true XY has y_calls >= 15, normal female 0-2,
# true X0/Turner ~0. Tune for different somalier panels or sequencing
# depths.
# y_calls > y_calls_loy_min on a DRAGEN X0 call -> loss-of-Y -> XY.
y_calls_loy_min = 5

# f_stat_raw ~ 1 looks XY (homozygous chrX); f_stat_raw ~ 0 looks XX
# (heterozygous). A 103-sample CPG cohort showed clean bimodal separation
# around 0.5, so a single midpoint is the production default. Asymmetric
# cutoffs (e.g. f_stat_xx_max=0.7 and f_stat_xy_min=0.3) are valid for
# cohorts whose distribution warrants a buffer zone around 0.5.
#   DRAGEN XX + f_stat_raw > f_stat_xx_max -> ambiguous
#   DRAGEN XY + f_stat_raw < f_stat_xy_min -> ambiguous
# Any ancestry-aware renormalisation of f_stat happens downstream in
# ourdna_genomic_atlas (where ancestry assignments are available).
f_stat_xx_max = 0.5
f_stat_xy_min = 0.5

[ica.pipelines]
dragen_version = 'dragen_3_7_8'

[slack]
channel = 'C09P4QCKNR1' # Slack channel ID for #popgen-pipeline-alerts
token_secret_id = 'dragen-single-sample-qc'
token_project_id = 'cpg-common'
